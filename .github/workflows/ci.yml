name: Koinelio build check

on:
  push:
    branches:
      - main
      - demo/iit-bhilai-source-backed-campus
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_buildcheck_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint application
        run: pnpm lint
      - name: Build production app
        run: pnpm build